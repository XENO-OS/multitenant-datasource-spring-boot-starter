import org.springframework.boot.gradle.plugin.SpringBootPlugin
plugins {
    id 'java'
    id 'java-library'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
    id("signing")
}

group = 'com.xenotech'
version = '3.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    // Lombok must run before the configuration processor so the generated metadata sees its accessors
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-autoconfigure-processor'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    api 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'

    // Optional integrations: each is activated only when the consuming application has it on the classpath
    compileOnly 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.springframework.boot:spring-boot-health'
    compileOnly 'io.micrometer:micrometer-core'

    testCompileOnly 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator'
    testImplementation 'org.springframework.boot:spring-boot-health'
    testImplementation 'io.micrometer:micrometer-core'
    testImplementation 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom SpringBootPlugin.BOM_COORDINATES
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

java {
    withSourcesJar()
}
bootJar {
    enabled = false
}

jar {
    enabled = true
    // Boot plugin defaults the plain jar to the 'plain' classifier; publish it as the main artifact
    archiveClassifier = ''
}
publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = 'com.xenotech'
            artifactId = 'multitenant-datasource-spring-boot-starter'
            version = project.version
            from components.java
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
        }
    }
    repositories {
        // repo.myxeno.com fronts /m2 over HTTPS (443): reads are GET, writes are HTTP PUT via nginx WebDAV.
        // Registered only when mavenU/mavenP creds are present (env or ~/.gradle/gradle.properties),
        // so publishToMavenLocal works without them.
        def mavenUser = System.getenv('mavenU') ?: findProperty('mavenU')
        def mavenPassword = System.getenv('mavenP') ?: findProperty('mavenP')
        if (mavenUser && mavenPassword) {
            maven {
                name = 'myxeno'
                credentials {
                    username = mavenUser
                    password = mavenPassword
                }
                url = version.endsWith('SNAPSHOT')
                        ? 'https://repo.myxeno.com/m2/snapshots'
                        : 'https://repo.myxeno.com/m2/releases'
            }
        }
    }
}
